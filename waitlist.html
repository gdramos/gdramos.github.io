<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Join the GR Toolbox lab demo waitlist and watch the queue.">
  <meta name="theme-color" content="#01426a">
  <title>Lab Demo Waitlist | GR Toolbox</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Goldman:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --main-yellow: #8b8000;
      --main-blue: #01426a;
      --main-green: #225d38;
      --main-dark: #2e2e2e;
      --input-dark: #232323;
      --text: #f5f5f5;
      --muted: #bac7c2;
      --focus: #eadb4c;
      --live: #69bd80;
      --danger: #ff8f87;
      --panel-border: 2px solid var(--main-dark);
      --shadow: 0 12px 28px rgba(0, 0, 0, 0.2);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      min-height: 100%;
      background: var(--main-dark);
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--text);
      background: radial-gradient(circle at 50% 0%, var(--main-blue), var(--main-dark) 82%) fixed;
      font-family: "Goldman", system-ui, sans-serif;
      font-weight: 400;
      letter-spacing: 1px;
    }

    button,
    input,
    textarea {
      font: inherit;
      letter-spacing: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      color: var(--text);
    }

    a {
      color: var(--text);
    }

    .skip-link {
      position: fixed;
      top: 8px;
      left: 8px;
      z-index: 100;
      padding: 10px 14px;
      border-radius: 8px;
      color: var(--main-dark);
      background: var(--focus);
      transform: translateY(-160%);
      transition: transform 150ms ease;
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    .top-bar {
      position: sticky;
      top: 0;
      z-index: 20;
      width: 100%;
      border-bottom: 1px solid rgba(245, 245, 245, 0.08);
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(10px);
    }

    .top-bar__inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: min(100% - 6vw, 1320px);
      min-height: 54px;
      margin: 0 auto;
      gap: 18px;
    }

    .breadcrumb {
      display: flex;
      min-width: 0;
      align-items: baseline;
      gap: 10px;
      white-space: nowrap;
    }

    .brand {
      color: var(--text);
      font-size: clamp(1.45rem, 2.4vw, 2rem);
      line-height: 1;
      text-decoration: none;
    }

    .brand:hover {
      color: var(--focus);
    }

    .slash {
      color: var(--focus);
      font-size: 1.35rem;
    }

    .page-name {
      overflow: hidden;
      color: var(--muted);
      font-size: 0.9rem;
      text-overflow: ellipsis;
    }

    .connection {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 1.125rem;
      white-space: nowrap;
    }

    .connection__dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: #8c9692;
      box-shadow: 0 0 0 4px rgba(140, 150, 146, 0.12);
    }

    .connection[data-state="live"] .connection__dot {
      background: var(--live);
      box-shadow: 0 0 0 4px rgba(105, 189, 128, 0.14);
      animation: live-pulse 2s ease-out infinite;
    }

    .connection[data-state="error"] .connection__dot {
      background: var(--danger);
      box-shadow: 0 0 0 4px rgba(255, 143, 135, 0.12);
    }

    @keyframes live-pulse {
      0%, 40% { box-shadow: 0 0 0 4px rgba(105, 189, 128, 0.14); }
      70% { box-shadow: 0 0 0 9px rgba(105, 189, 128, 0); }
      100% { box-shadow: 0 0 0 4px rgba(105, 189, 128, 0); }
    }

    main {
      width: min(100% - 6vw, 1320px);
      margin: 0 auto;
      padding: 24px 0 32px;
    }

    .intro {
      display: flex;
      align-items: end;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 24px;
    }

    .intro h1 {
      margin: 0 0 7px;
      font-size: clamp(1.65rem, 3.2vw, 2.5rem);
      font-weight: 700;
      line-height: 1.1;
    }

    .intro p {
      max-width: 720px;
      margin: 0;
      color: var(--muted);
      font-size: 0.87rem;
      line-height: 1.6;
    }

    .notice {
      display: none;
      margin-bottom: 12px;
      padding: 12px 14px;
      border: 1px solid rgba(234, 219, 76, 0.55);
      border-left: 4px solid var(--focus);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.22);
      color: var(--muted);
      font-size: 0.77rem;
      line-height: 1.55;
    }

    .notice[data-visible="true"] {
      display: block;
    }

    .notice strong {
      color: var(--text);
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(320px, 0.78fr) minmax(0, 1.52fr);
      align-items: start;
      gap: 10px;
    }

    .panel {
      overflow: hidden;
      border: var(--panel-border);
      border-radius: 10px;
      background: rgba(34, 93, 56, 0.9);
      box-shadow: var(--shadow);
    }

    .panel__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 58px;
      padding: 13px 16px;
      gap: 12px;
      border-bottom: 1px solid rgba(245, 245, 245, 0.1);
      background: rgba(0, 0, 0, 0.16);
    }

    .panel__heading {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 11px;
    }

    .panel__number {
      display: grid;
      width: 30px;
      height: 30px;
      flex: 0 0 auto;
      place-items: center;
      border: 1px solid rgba(245, 245, 245, 0.25);
      border-radius: 7px;
      color: var(--focus);
      background: rgba(0, 0, 0, 0.2);
      font-size: 0.72rem;
    }

    .panel h2 {
      margin: 0;
      font-size: 1rem;
      font-weight: 700;
    }

    .panel__body {
      padding: 14px 16px;
    }

    .field-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .field {
      min-width: 0;
    }

    .field--wide {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: var(--text);
      font-size: 0.72rem;
    }

    .optional {
      color: var(--muted);
      font-size: 0.64rem;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid rgba(245, 245, 245, 0.3);
      border-radius: 8px;
      outline: none;
      color: var(--text);
      background: var(--input-dark);
      font-size: 0.83rem;
      line-height: 1.35;
      transition: border-color 140ms ease, box-shadow 140ms ease;
    }

    input {
      min-height: 44px;
      padding: 10px 11px;
    }

    textarea {
      min-height: 70px;
      padding: 11px;
      resize: vertical;
    }

    input::placeholder,
    textarea::placeholder {
      color: #8f9c98;
      opacity: 1;
    }

    input:focus,
    textarea:focus {
      border-color: var(--focus);
      box-shadow: 0 0 0 3px rgba(234, 219, 76, 0.25);
    }

    .field__hint {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 0.62rem;
      line-height: 1.45;
    }

    .privacy-note {
      display: flex;
      margin: 10px 0;
      padding: 8px 10px;
      gap: 9px;
      border-radius: 7px;
      background: rgba(0, 0, 0, 0.14);
      color: var(--muted);
      font-size: 0.65rem;
      line-height: 1.5;
    }

    .privacy-note__icon {
      flex: 0 0 auto;
      color: var(--focus);
    }

    .form-status {
      min-height: 1.1rem;
      margin: 0 0 6px;
      color: var(--muted);
      font-size: 0.69rem;
      line-height: 1.4;
    }

    .form-status[data-kind="success"] {
      color: #a5e0b5;
    }

    .form-status[data-kind="error"] {
      color: var(--danger);
    }

    .button {
      display: inline-flex;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 2px solid var(--main-dark);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 700;
      transition: transform 100ms ease, filter 150ms ease;
    }

    .button:focus-visible,
    .brand:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    .button--primary {
      width: 100%;
      padding: 10px 16px;
      background: var(--main-green);
    }

    .button--primary:hover:not(:disabled) {
      background: linear-gradient(to right, var(--main-green), var(--main-yellow));
    }

    .button--secondary {
      min-height: 35px;
      padding: 7px 11px;
      background: var(--main-blue);
      font-size: 1.005rem;
    }

    .button--secondary:hover:not(:disabled) {
      background: linear-gradient(to right, var(--main-blue), #17658f);
    }

    .button:active:not(:disabled) {
      transform: translateY(2px);
    }

    .button:disabled {
      border-color: #5d6461;
      cursor: not-allowed;
      color: #a9b1ae;
      background: #3b4140;
    }

    .button__spinner {
      display: none;
      width: 15px;
      height: 15px;
      border: 2px solid rgba(245, 245, 245, 0.35);
      border-top-color: var(--text);
      border-radius: 999px;
      animation: spin 700ms linear infinite;
    }

    .button[data-loading="true"] .button__spinner {
      display: block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .queue-meta {
      color: var(--muted);
      font-size: 0.975rem;
    }

    .queue-delay-note {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.5;
    }

    .queue-footnote {
      display: flex;
      justify-content: space-between;
      margin: 12px 1px 0;
      gap: 18px;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    footer {
      width: min(100% - 6vw, 1320px);
      margin: 0 auto;
      padding: 0 0 24px;
      color: var(--muted);
      font-size: 0.62rem;
      line-height: 1.5;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 860px) {
      .intro {
        align-items: start;
        flex-direction: column;
      }

      .workspace {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 560px) {
      .top-bar__inner,
      main,
      footer {
        width: min(100% - 24px, 1320px);
      }

      .page-name,
      .slash {
        display: none;
      }

      .connection__label {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
      }

      main {
        padding-top: 22px;
      }

      .intro p {
        font-size: 0.87rem;
      }

      .field-grid {
        grid-template-columns: 1fr;
      }

      .field--wide {
        grid-column: auto;
      }

      .panel__body {
        padding: 14px 12px;
      }

      .queue-footnote {
        flex-direction: column;
        gap: 4px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }

    /* Google Form + published-Sheet version */
    .workspace {
      grid-template-columns: minmax(380px, 0.9fr) minmax(0, 1.35fr);
    }

    .notice code {
      color: var(--focus);
      font-family: Consolas, "Courier New", monospace;
      letter-spacing: 0;
    }

    .form-guidance {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin: 0 0 10px;
      gap: 16px;
      color: var(--muted);
      font-size: 1.005rem;
      line-height: 1.5;
    }

    .form-guidance p {
      margin: 0;
    }

    .form-guidance strong {
      color: var(--text);
    }

    .form-open {
      flex: 0 0 auto;
      color: var(--focus);
      font-size: 0.945rem;
      text-underline-offset: 3px;
      white-space: nowrap;
    }

    .form-open:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    .queue-open {
      color: var(--focus);
      text-underline-offset: 3px;
    }

    .queue-open:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 3px;
    }

    .form-embed-shell {
      overflow: hidden;
      border: 2px solid var(--main-dark);
      border-radius: 10px;
      background: #f0ebf8;
    }

    .form-embed {
      display: block;
      width: 100%;
      height: 920px;
      border: 0;
      background: #f0ebf8;
    }

    .queue-embed-shell {
      overflow: hidden;
      border: 2px solid var(--main-dark);
      border-radius: 10px;
      background: #fff;
    }

    .queue-embed {
      display: block;
      width: 100%;
      height: clamp(520px, 65vh, 700px);
      border: 0;
      background: #fff;
      color-scheme: light;
    }

    .privacy-note {
      margin-bottom: 0;
    }

    @media (max-width: 920px) {
      .workspace {
        grid-template-columns: 1fr;
      }

      .form-embed {
        height: 860px;
      }

    }

    @media (max-width: 560px) {
      .form-guidance {
        display: block;
      }

      .form-open {
        display: inline-block;
        margin-top: 7px;
      }

      .form-embed {
        height: clamp(860px, calc(1120px - 45vw), 970px);
      }

      .queue-embed {
        height: clamp(440px, 62vh, 560px);
      }
    }
  </style>
</head>

<body>
  <a class="skip-link" href="#main-content">Skip to waitlist</a>

  <header class="top-bar">
    <div class="top-bar__inner">
      <div class="breadcrumb" aria-label="Breadcrumb">
        <a class="brand" href="./">GR Toolbox</a>
      </div>

      <div class="connection" id="connection" data-state="idle" role="status" aria-live="polite">
        <span class="connection__dot" aria-hidden="true"></span>
        <span class="connection__label" id="connection-label">Loading…</span>
      </div>
    </div>
  </header>

  <main id="main-content">
    <section class="intro" aria-labelledby="page-title">
      <div>
        <h1 id="page-title">Lab Demo Waitlist</h1>
        <p>Submit once.</p>
      </div>
    </section>

    <div class="workspace">
      <section class="panel" aria-labelledby="join-title">
        <header class="panel__header">
          <div class="panel__heading">
            <h2 id="join-title">Sign up</h2>
          </div>
        </header>

        <div class="panel__body">
          <div class="form-guidance">
            <p><strong>First name + last initial.</strong> No IDs, email, or grades.</p>
            <a class="form-open" href="https://docs.google.com/forms/d/e/1FAIpQLSeulik7OZdfgFPxX_pNRbxIo0n0CvDHkDmU09vzxZSXSA7a1Q/viewform" target="_blank" rel="noopener">Open in new tab ↗</a>
          </div>

          <div class="form-embed-shell">
            <iframe
              class="form-embed"
              id="form-embed"
              src="https://docs.google.com/forms/d/e/1FAIpQLSeulik7OZdfgFPxX_pNRbxIo0n0CvDHkDmU09vzxZSXSA7a1Q/viewform?embedded=true"
              title="Join the Lab Demo Waitlist"
              loading="eager">Loading the waitlist form…</iframe>
          </div>

        </div>
      </section>

      <section class="panel" aria-labelledby="queue-title">
        <header class="panel__header">
          <div class="panel__heading">
            <div>
              <h2 id="queue-title">Queue</h2>
              <span class="queue-meta" id="last-updated">Checking…</span>
            </div>
          </div>

          <button class="button button--secondary" id="refresh-button" type="button" aria-label="Refresh the waitlist">
            <span aria-hidden="true">↻</span>
            <span>Refresh</span>
          </button>
        </header>

        <div class="panel__body">
          <p class="queue-delay-note">It may take some time after submitting for your name to appear here.</p>

          <div class="queue-embed-shell">
            <iframe
              class="queue-embed"
              id="queue-embed"
              src="https://docs.google.com/spreadsheets/d/e/2PACX-1vTjX5lEpkEaaw7zhmoIbkBlQHVTWKOfkuZir7XggwArxE-Ap367wIxmqyDfQDsoyEOFGz-RiWEyrfJe/pubhtml?gid=0&amp;single=true&amp;widget=false&amp;headers=false&amp;chrome=false"
              title="Live Lab Demo Waitlist queue"
              loading="eager">Loading the queue…</iframe>
          </div>

          <div class="queue-footnote">
            <span>Updates every 30 sec.</span>
            <a
              class="queue-open"
              href="https://docs.google.com/spreadsheets/d/e/2PACX-1vTjX5lEpkEaaw7zhmoIbkBlQHVTWKOfkuZir7XggwArxE-Ap367wIxmqyDfQDsoyEOFGz-RiWEyrfJe/pubhtml?gid=0&amp;single=true&amp;widget=false&amp;headers=false&amp;chrome=false"
              target="_blank"
              rel="noopener">Open queue ↗</a>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script>
    "use strict";

    const CONFIG = Object.freeze({
      queueEmbedUrl: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTjX5lEpkEaaw7zhmoIbkBlQHVTWKOfkuZir7XggwArxE-Ap367wIxmqyDfQDsoyEOFGz-RiWEyrfJe/pubhtml?gid=0&single=true&widget=false&headers=false&chrome=false",
      refreshIntervalMs: 30000,
      refreshTimeoutMs: 20000,
      submissionRefreshDelaysMs: Object.freeze([2000, 10000])
    });

    const elements = {
      connection: document.querySelector("#connection"),
      connectionLabel: document.querySelector("#connection-label"),
      lastUpdated: document.querySelector("#last-updated"),
      refreshButton: document.querySelector("#refresh-button"),
      formEmbed: document.querySelector("#form-embed"),
      queueEmbed: document.querySelector("#queue-embed")
    };

    let refreshInProgress = false;
    let refreshTimeoutId = null;
    let formInitialLoadComplete = false;
    let submissionRefreshTimeoutIds = [];
    let queuedForcedRefresh = false;

    function setConnection(kind, label) {
      elements.connection.dataset.state = kind;
      elements.connectionLabel.textContent = label;
    }

    function cacheBustedQueueUrl() {
      const url = new URL(CONFIG.queueEmbedUrl);
      url.searchParams.set("_", String(Date.now()));
      return url.toString();
    }

    function refreshedTimeLabel() {
      return "Reloaded " + new Intl.DateTimeFormat([], {
        hour: "numeric",
        minute: "2-digit"
      }).format(new Date());
    }

    function runQueuedForcedRefresh() {
      if (!queuedForcedRefresh) return;

      queuedForcedRefresh = false;
      window.setTimeout(function () {
        reloadQueue(true);
      }, 0);
    }

    function finishRefresh() {
      refreshInProgress = false;
      elements.refreshButton.disabled = false;

      if (refreshTimeoutId !== null) {
        window.clearTimeout(refreshTimeoutId);
        refreshTimeoutId = null;
      }

      setConnection("live", "Queue view");
      elements.lastUpdated.textContent = refreshedTimeLabel();
      runQueuedForcedRefresh();
    }

    function showRefreshError() {
      refreshInProgress = false;
      elements.refreshButton.disabled = false;

      if (refreshTimeoutId !== null) {
        window.clearTimeout(refreshTimeoutId);
        refreshTimeoutId = null;
      }

      setConnection("error", "Queue unavailable");
      elements.lastUpdated.textContent = "Open queue link";
      runQueuedForcedRefresh();
    }

    function reloadQueue(force) {
      if (refreshInProgress) {
        if (force) queuedForcedRefresh = true;
        return;
      }
      if (!force && document.hidden) return;
      if (!force && document.activeElement === elements.queueEmbed) return;

      refreshInProgress = true;
      elements.refreshButton.disabled = true;
      elements.lastUpdated.textContent = "Refreshing…";
      setConnection("idle", "Refreshing…");
      elements.queueEmbed.src = cacheBustedQueueUrl();

      refreshTimeoutId = window.setTimeout(function () {
        if (refreshInProgress) showRefreshError();
      }, CONFIG.refreshTimeoutMs);
    }

    function scheduleSubmissionRefreshes() {
      submissionRefreshTimeoutIds.forEach(function (timeoutId) {
        window.clearTimeout(timeoutId);
      });

      submissionRefreshTimeoutIds = CONFIG.submissionRefreshDelaysMs.map(function (delayMs) {
        return window.setTimeout(function () {
          reloadQueue(true);
        }, delayMs);
      });
    }

    function handleFormLoad() {
      if (!formInitialLoadComplete) {
        formInitialLoadComplete = true;
        return;
      }

      scheduleSubmissionRefreshes();
    }

    function markInitialFormLoadComplete() {
      formInitialLoadComplete = true;
    }

    function initialize() {
      elements.formEmbed.addEventListener("load", handleFormLoad);
      elements.queueEmbed.addEventListener("load", finishRefresh);
      elements.queueEmbed.addEventListener("error", showRefreshError);

      if (document.readyState === "complete") {
        markInitialFormLoadComplete();
      } else {
        window.addEventListener("load", markInitialFormLoadComplete, { once: true });
      }

      elements.refreshButton.addEventListener("click", function () {
        reloadQueue(true);
      });

      window.setInterval(function () {
        reloadQueue(false);
      }, CONFIG.refreshIntervalMs);

      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) reloadQueue(false);
      });
    }

    initialize();
  </script>
</body>
</html>
